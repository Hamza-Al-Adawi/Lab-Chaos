<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lab Chaos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#123540; --wall2:#0b232b; --wall3:#081a20;
  --bench:#4d3a2a; --bench2:#33251a; --bench3:#5e4835;
  --bone:#ece4d3; 
  --dim:#8ba0a8;
  --amber:#f2a541; --amber2:#c97f1e;
  --lilac:#b06fd0;
  --cuprite:#2f8fbf;
  --danger:#e0523c;
  --heart:#ff5a6a;
  --good:#5fd08a;
  --tox:#a8d84a;
  --glass:rgba(233,245,250,.16);
  --card:#14323b;
  --card2:#0f2831;
  --line:rgba(236,228,211,.14);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--wall3);
  color:var(--bone);
  font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,system-ui,sans-serif;
  font-weight:600;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font-family:inherit;font-weight:700;color:inherit;border:0;background:none;cursor:pointer}
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  max-width:560px;margin:0 auto;
  background:var(--wall3);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ---------- HUD ---------- */
#hud{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:8px 12px;background:var(--wall3);
  border-bottom:1px solid var(--line);z-index:40;
}
.hud-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:14px;line-height:1;
}
.hud-pill .ic{font-size:14px}
#hearts{display:flex;gap:3px;align-items:center}
.hp{width:16px;height:16px;transition:transform .25s,opacity .25s}
.hp.gone{opacity:.22;transform:scale(.78)}
.hp.pulse{animation:hbeat .5s}
@keyframes hbeat{0%,100%{transform:scale(1)}40%{transform:scale(1.5)}}
#coinBox{color:var(--amber)}
#hud .spacer{flex:1}
#langBtn{
  background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:4px 10px;font-size:13px;
}
#homeBtn{
  background:var(--card2);border:1px solid var(--line);border-radius:999px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;
}

/* ---------- screens ---------- */
.screen{
  flex:1;min-height:0;display:none;flex-direction:column;
}
.screen.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 28px}

/* ---------- home ---------- */
#s-home .scroll{display:flex;flex-direction:column;justify-content:center;text-align:center}
.logo{
  font-size:clamp(38px,13vw,60px);font-weight:800;line-height:.92;
  letter-spacing:-.02em;margin:0 0 2px;
}
.logo .l2{display:block;color:var(--amber);text-shadow:0 0 26px rgba(242,165,65,.4)}
.tag{color:var(--dim);font-size:14px;font-weight:600;margin:6px 0 22px;line-height:1.5}
.menu{display:flex;flex-direction:column;gap:10px;max-width:340px;width:100%;margin:0 auto}
.mbtn{
  display:flex;align-items:center;gap:12px;text-align:start;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;font-size:16px;transition:transform .12s,background .15s;
}
.mbtn:active{transform:scale(.975);background:#19404b}
.mbtn .em{font-size:21px;width:26px;text-align:center;flex:0 0 auto}
.mbtn .sub{display:block;font-size:11.5px;color:var(--dim);font-weight:600;margin-top:1px}
.mbtn.primary{background:linear-gradient(160deg,var(--amber) 0%,var(--amber2) 100%);color:#241503;border-color:transparent}
.mbtn.primary .sub{color:rgba(36,21,3,.66)}

/* ---------- lab ---------- */
#s-lab{position:relative}
#task{
  flex:0 0 auto;margin:8px 12px 0;padding:9px 12px;
  background:var(--card);border:1px solid var(--line);border-inline-start:3px solid var(--amber);
  border-radius:10px;font-size:13px;line-height:1.35;
}
#task .tl{color:var(--amber);font-size:11px;display:block;margin-bottom:1px}
#stage{
  flex:1;min-height:0;position:relative;overflow:hidden;
  margin:8px 0 0;
  background:
    radial-gradient(120% 80% at 50% 0%,#1a4855 0%,var(--wall) 45%,var(--wall2) 100%);
}
#stage.shake{animation:shk .32s linear infinite}
@keyframes shk{
  0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}
  50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-2px)}
  100%{transform:translate(0,0)}
}
.flicker{position:absolute;inset:0;background:rgba(180,230,240,.045);animation:flk 7s infinite;pointer-events:none}
@keyframes flk{0%,96%,100%{opacity:1}97%{opacity:.25}98%{opacity:.9}99%{opacity:.35}}

/* shelf on wall */
.wallshelf{position:absolute;top:9%;left:0;right:0;height:34px}
.wallshelf .board{position:absolute;bottom:0;left:6%;right:6%;height:5px;background:var(--bench2);border-radius:2px}
.wallshelf .jar{position:absolute;bottom:5px;width:11px;height:19px;border-radius:2px 2px 3px 3px;opacity:.5}
.hood{
  position:absolute;top:14%;inset-inline-end:3%;width:26%;height:30%;
  border:2px solid rgba(236,228,211,.2);border-radius:6px;
  background:linear-gradient(180deg,rgba(120,200,220,.10),rgba(120,200,220,.02));
}
.hood .sash{position:absolute;left:0;right:0;top:0;background:rgba(160,220,235,.16);
  border-bottom:2px solid rgba(236,228,211,.3);transition:height .4s;height:70%}
.hood.open .sash{height:14%}
.hood .lbl{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8.5px;color:var(--dim)}
.wallkit{position:absolute;top:15%;inset-inline-start:4%;display:flex;flex-direction:column;gap:9px;font-size:17px;opacity:.75}

/* bench */
.bench{position:absolute;left:0;right:0;bottom:0;height:26%;
  background:linear-gradient(180deg,var(--bench3) 0 9px,var(--bench) 9px,var(--bench2) 100%);
  border-top:2px solid #6b5340;
}
.bench::after{content:"";position:absolute;top:12px;left:8%;width:26%;height:2px;background:rgba(0,0,0,.32);border-radius:2px}
.bench::before{content:"";position:absolute;top:22px;inset-inline-end:14%;width:16%;height:3px;background:rgba(0,0,0,.25);border-radius:2px;filter:blur(.4px)}

/* character */
#doc{position:absolute;bottom:24%;inset-inline-start:6%;width:74px;transition:transform .2s}
#doc.panic{animation:jump .4s infinite}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* beaker */
#beakerWrap{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:132px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
#bubbles{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.62);animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-62px) scale(1.15);opacity:0}}
.steam{position:absolute;bottom:56%;left:50%;width:15px;height:15px;border-radius:50%;
  background:rgba(255,255,255,.3);filter:blur(4px);animation:steamUp 2s ease-out forwards}
@keyframes steamUp{0%{transform:translate(-50%,0) scale(.5);opacity:.75}100%{transform:translate(-50%,-90px) scale(2.4);opacity:0}}
#gasVeil{position:absolute;inset:0;background:radial-gradient(circle at 50% 70%,rgba(168,216,74,.55),rgba(168,216,74,0) 70%);opacity:0;transition:opacity .7s;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
#fireLayer{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at 50% 78%,rgba(242,120,40,.65),rgba(242,60,20,0) 62%)}

/* speech */
#say{
  position:absolute;bottom:44%;inset-inline-start:4%;max-width:52%;
  background:var(--bone);color:#16303a;border-radius:10px;padding:6px 9px;
  font-size:11.5px;line-height:1.3;opacity:0;transition:opacity .25s;font-weight:700;
}
#say.on{opacity:1}

/* ---------- controls ---------- */
#controls{flex:0 0 auto;background:var(--wall3);border-top:1px solid var(--line);padding:8px 10px 10px}
.row{display:flex;gap:7px;align-items:center}
.gear{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 2px;
  font-size:9.5px;color:var(--dim);transition:background .15s,border-color .15s,color .15s;
}
.gear .g{font-size:16px;filter:grayscale(1) opacity(.5);transition:filter .15s}
.gear.on{background:#1d4a3a;border-color:#3f8f6a;color:#9fe0bd}
.gear.on .g{filter:none}

#slots{display:flex;gap:7px;margin:7px 0}
.slot{
  flex:1;height:46px;border-radius:10px;border:1.5px dashed rgba(236,228,211,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:var(--card2);font-size:9px;color:var(--dim);position:relative;overflow:hidden;
}
.slot.filled{border-style:solid;border-color:var(--amber);color:var(--bone)}
.slot .sym{font-size:15px;font-weight:800;line-height:1.05}
.slot .nm{font-size:8.5px;opacity:.72;line-height:1.1;padding:0 3px;text-align:center}
.slot .swatch{position:absolute;top:0;left:0;right:0;height:3px}
#mixBtn{
  flex:0 0 88px;height:46px;border-radius:10px;
  background:linear-gradient(160deg,var(--amber),var(--amber2));color:#241503;
  font-size:16px;font-weight:800;transition:transform .12s,filter .2s;
}
#mixBtn:disabled{filter:grayscale(.75) brightness(.62)}
#mixBtn:active:not(:disabled){transform:scale(.95)}

#shelf{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
#shelf::-webkit-scrollbar{display:none}
.rg{
  flex:0 0 auto;width:58px;border-radius:10px;background:var(--card);
  border:1px solid var(--line);padding:5px 3px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s,border-color .15s;
}
.rg:active{transform:scale(.93)}
.rg.sel{border-color:var(--amber);background:#1c4351}
.bottle{width:19px;height:26px;border-radius:3px 3px 5px 5px;position:relative;box-shadow:inset -3px 0 5px rgba(0,0,0,.3)}
.bottle::before{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:8px;height:5px;background:#7d6a55;border-radius:2px}
.bottle .sh{position:absolute;top:3px;left:2.5px;width:2.5px;height:60%;background:rgba(255,255,255,.5);border-radius:2px}
.rg .s{font-size:10.5px;font-weight:800;line-height:1.1}
.rg .n{font-size:7.5px;color:var(--dim);line-height:1.05;text-align:center;height:17px;overflow:hidden}

/* emergency */
#emerg{
  position:absolute;inset:0;background:rgba(8,26,32,.9);backdrop-filter:blur(2px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:60;padding:20px;
}
#emerg.on{display:flex}
#emerg h3{margin:0;font-size:21px;color:var(--danger);text-align:center}
#emerg p{margin:0;font-size:13px;color:var(--dim);text-align:center;max-width:280px;line-height:1.4}
#timerBar{width:190px;height:7px;background:var(--card2);border-radius:4px;overflow:hidden}
#timerFill{height:100%;width:100%;background:var(--danger);transition:width .1s linear}
.erow{display:flex;gap:10px}
.ebtn{
  width:80px;height:80px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--dim);
}
.ebtn .e{font-size:29px}
.ebtn:active{transform:scale(.94);border-color:var(--amber)}

/* ---------- result sheet ---------- */
#sheet{
  position:absolute;inset-inline:0;bottom:0;z-index:70;
  background:var(--card);border-radius:20px 20px 0 0;border-top:2px solid var(--line);
  transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.3,1);
  max-height:82%;display:flex;flex-direction:column;
}
#sheet.on{transform:translateY(0)}
#sheet .grab{width:38px;height:4px;border-radius:3px;background:rgba(236,228,211,.25);margin:8px auto 2px;flex:0 0 auto}
#sheet .body{overflow-y:auto;padding:8px 16px 14px}
#sheet .verdict{font-size:23px;font-weight:800;margin:2px 0 1px;display:flex;align-items:center;gap:7px}
#sheet .eq{
  font-size:13.5px;color:var(--bone);background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;margin:8px 0;direction:ltr;text-align:center;letter-spacing:.02em;
}
#sheet .why{font-size:13.5px;line-height:1.55;color:#cfdde2;font-weight:600}
#sheet .why b{color:var(--amber);font-weight:800}
#sheet .lesson{
  margin-top:9px;padding:9px 11px;background:rgba(242,165,65,.09);
  border-inline-start:3px solid var(--amber);border-radius:0 9px 9px 0;font-size:12.5px;line-height:1.5;
}
#sheet .deltas{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.delta{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--card2);border:1px solid var(--line)}
.delta.pos{color:var(--good)}.delta.neg{color:var(--danger)}
#sheetBtns{display:flex;gap:8px;padding:0 16px 16px;flex:0 0 auto}
.sbtn{flex:1;padding:12px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:14px}
.sbtn.go{background:linear-gradient(160deg,var(--amber),var(--amber2));color:#241503;border-color:transparent}

/* ---------- generic cards ---------- */
h2.title{font-size:25px;margin:2px 0 3px;font-weight:800}
p.lede{color:var(--dim);font-size:12.5px;margin:0 0 15px;line-height:1.5}
.lvl{
  display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;margin-bottom:8px;text-align:start;width:100%;
}
.lvl:active{transform:scale(.985)}
.lvl.locked{opacity:.42}
.lvl .num{
  flex:0 0 34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;
}
.lvl.done .num{background:var(--good);color:#08221a;border-color:transparent}
.lvl .t{flex:1;min-width:0}
.lvl .t .a{font-size:14.5px;line-height:1.2}
.lvl .t .b{font-size:11px;color:var(--dim);line-height:1.3;margin-top:2px}
.lvl .st{font-size:16px;flex:0 0 auto}

.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.note .h{display:flex;align-items:center;gap:7px;font-size:14.5px}
.note .eqn{font-size:12px;color:var(--amber);direction:ltr;margin:5px 0 4px;font-weight:700}
.note .d{font-size:12.5px;color:#cfdde2;line-height:1.5;font-weight:600}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:44px 20px;line-height:1.6}

.ch{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.ch.done{border-color:rgba(95,208,138,.5);background:rgba(95,208,138,.07)}
.ch .ci{font-size:22px;flex:0 0 auto}
.ch .cb{flex:1;min-width:0}
.ch .cn{font-size:14px}
.ch .cd{font-size:11px;color:var(--dim);margin-top:1px;line-height:1.35}
.bar{height:5px;background:var(--card2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:3px;transition:width .4s}
.ch .cr{font-size:12px;color:var(--amber);flex:0 0 auto;font-weight:800}

/* periodic */
#ptWrap{flex:1;min-height:0;overflow:auto;padding:10px 12px 24px;-webkit-overflow-scrolling:touch}
#pt{display:grid;grid-template-columns:repeat(18,30px);gap:2.5px;width:max-content;margin:0 auto}
.el{
  height:30px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;line-height:1;color:#0b1c22;position:relative;
}
.el .z{position:absolute;top:1.5px;inset-inline-start:2.5px;font-size:6px;opacity:.65;font-weight:700}
.el.have{outline:2px solid var(--amber);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:11px auto 0;max-width:420px}
.lg{font-size:9.5px;padding:2.5px 7px;border-radius:999px;color:#0b1c22;font-weight:700}
.ptnote{text-align:center;color:var(--dim);font-size:11px;margin-top:9px;line-height:1.5}

#elModal{
  position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(8,26,32,.8);backdrop-filter:blur(3px);
}
#elModal.on{display:flex}
#elCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:300px;text-align:center}
#elCard .big{font-size:52px;font-weight:800;line-height:1}
#elCard .nm{font-size:19px;margin-top:2px}
#elCard .meta{color:var(--dim);font-size:12.5px;margin-top:7px;line-height:1.6}
#elCard .cat{display:inline-block;margin-top:9px;font-size:11px;padding:3px 11px;border-radius:999px;color:#0b1c22;font-weight:700}

#toast{
  position:absolute;top:10px;left:50%;transform:translateX(-50%) translateY(-140%);
  background:var(--amber);color:#241503;padding:9px 15px;border-radius:999px;font-size:13px;
  z-index:90;transition:transform .35s;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.4);max-width:92%;
}
#toast.on{transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .flicker{display:none}
}
button:focus-visible,.el:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px}
@media (max-height:640px){
  #beakerWrap{width:110px}
  #doc{width:62px}
  .rg{width:54px}
  #task{font-size:12px;padding:7px 10px}
}
#task{display:flex;align-items:center;gap:8px}
#task .tk{flex:1;min-width:0}
#hintBtn{
  flex:0 0 auto;width:27px;height:27px;border-radius:50%;
  background:var(--card2);border:1px solid var(--amber);color:var(--amber);
  font-size:14px;font-weight:800;line-height:1;
}
#hintBtn.on{background:var(--amber);color:#241503}
.hintchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hintchip{
  display:flex;align-items:center;gap:5px;background:var(--card2);
  border:1px solid var(--amber);border-radius:999px;padding:3px 9px;font-size:11px;
}
.hintchip i{width:9px;height:9px;border-radius:2px;display:block}
.hintgear{font-size:11px;color:var(--amber);margin-top:5px}

/* guide */
.gsec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.gsec h3{margin:0 0 3px;font-size:15px;color:var(--amber)}
.gsec p{margin:0 0 7px;font-size:12.5px;line-height:1.55;color:#cfdde2;font-weight:600}
.gstep{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.gstep .n{
  flex:0 0 20px;height:20px;border-radius:50%;background:var(--amber);color:#241503;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px;
}
.gstep .x{flex:1;font-size:12.5px;line-height:1.5;color:#cfdde2;font-weight:600}
.grow{display:flex;gap:9px;align-items:flex-start;margin-bottom:6px;font-size:12.5px;line-height:1.5;color:#cfdde2;font-weight:600}
.grow .k{flex:0 0 76px;color:var(--bone);font-weight:800}
.gwalk{width:100%;text-align:start;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px}
.gwalk .q{font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.gwalk .q b{color:var(--amber);font-weight:800}
.gwalk .a{font-size:12px;color:#cfdde2;line-height:1.5;margin-top:6px;display:none;font-weight:600}
.gwalk.open .a{display:block}

/* coach */
#coach{position:absolute;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(8,26,32,.86);backdrop-filter:blur(3px)}
#coach.on{display:flex}
#coachCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:320px}
#coachCard .ch-step{font-size:11px;color:var(--amber);margin-bottom:3px}
#coachCard h3{margin:0 0 6px;font-size:18px}
#coachCard p{margin:0;font-size:13px;line-height:1.6;color:#cfdde2;font-weight:600}
#coachCard .ch-btns{display:flex;gap:8px;margin-top:15px}

[dir=rtl] #sheet .lesson{border-radius:9px 0 0 9px}
[dir=rtl] .logo{letter-spacing:0}

</head>
<body>
<div id="app">

  <div id="hud">
    <div class="hud-pill" id="hearts"></div>
    <div class="hud-pill" id="coinBox"><span class="ic">🪙</span><span id="coins">0</span></div>
    <div class="hud-pill" id="safeBox"><span class="ic">🥽</span><span id="safety">100</span></div>
    <div class="spacer"></div>
    <button id="langBtn">عربي</button>
    <button id="homeBtn">✕</button>
  </div>

  <!-- HOME -->
  <section class="screen on" id="s-home">
    <div class="scroll">
      <h1 class="logo"><span class="l1" id="logo1">LAB</span><span class="l2" id="logo2">CHAOS</span></h1>
      <p class="tag" id="tagline"></p>
      <div class="menu">
        <button class="mbtn primary" data-go="levels"><span class="em">🧪</span><span><span data-t="mStory"></span><span class="sub" data-t="mStorySub"></span></span></button>
        <button class="mbtn" data-go="free"><span class="em">💥</span><span><span data-t="mFree"></span><span class="sub" data-t="mFreeSub"></span></span></button>
        <button class="mbtn" data-go="challenges"><span class="em">🏆</span><span><span data-t="mCh"></span><span class="sub" data-t="mChSub"></span></span></button>
        <button class="mbtn" data-go="notes"><span class="em">📓</span><span><span data-t="mNotes"></span><span class="sub" data-t="mNotesSub"></span></span></button>
        <button class="mbtn" data-go="guide"><span class="em">📖</span><span><span data-t="mGuide"></span><span class="sub" data-t="mGuideSub"></span></span></button>
        <button class="mbtn" data-go="pt"><span class="em">⚛️</span><span><span data-t="mPt"></span><span class="sub" data-t="mPtSub"></span></span></button>
        <button class="mbtn" data-go="shop"><span class="em">❤️</span><span><span data-t="mShop"></span><span class="sub" data-t="mShopSub"></span></span></button>
      </div>
    </div>
  </section>

  <!-- LEVELS -->
  <section class="screen" id="s-levels">
    <div class="scroll">
      <h2 class="title" data-t="lvTitle"></h2>
      <p class="lede" data-t="lvLede"></p>
      <div id="lvlList"></div>
    </div>
  </section>

  <!-- LAB -->
  <section class="screen" id="s-lab">
    <div id="task">
      <div class="tk"><span class="tl" id="taskLabel"></span><span id="taskText"></span></div>
      <button id="hintBtn">?</button>
    </div>
    <div id="stage">
      <div class="flicker"></div>
      <div class="wallshelf"><div class="board"></div></div>
      <div class="hood" id="hoodVis"><div class="sash"></div><div class="lbl" data-t="hoodLbl"></div></div>
      <div class="wallkit"><span>🧯</span><span>🚿</span></div>
      <div class="bench"></div>
      <div id="doc"></div>
      <div id="say"></div>
      <div id="beakerWrap"><div id="beakerSvg"></div><div id="bubbles"></div></div>
      <div id="fireLayer"></div>
      <div id="gasVeil"></div>
      <div id="flash"></div>
      <div id="emerg">
        <h3 id="emergTitle"></h3>
        <p id="emergText"></p>
        <div id="timerBar"><div id="timerFill"></div></div>
        <div class="erow">
          <button class="ebtn" data-e="ext"><span class="e">🧯</span><span data-t="eExt"></span></button>
          <button class="ebtn" data-e="hood"><span class="e">🌬️</span><span data-t="eHood"></span></button>
          <button class="ebtn" data-e="shower"><span class="e">🚿</span><span data-t="eShower"></span></button>
        </div>
      </div>
      <div id="sheet">
        <div class="grab"></div>
        <div class="body">
          <div class="verdict" id="vTitle"></div>
          <div class="eq" id="vEq"></div>
          <div class="why" id="vWhy"></div>
          <div class="lesson" id="vLesson"></div>
          <div class="deltas" id="vDeltas"></div>
        </div>
        <div id="sheetBtns">
          <button class="sbtn" id="sAgain"></button>
          <button class="sbtn go" id="sNext"></button>
        </div>
      </div>
    </div>
    <div id="controls">
      <div class="row">
        <button class="gear" data-gear="goggles"><span class="g">🥽</span><span data-t="gGoggles"></span></button>
        <button class="gear" data-gear="gloves"><span class="g">🧤</span><span data-t="gGloves"></span></button>
        <button class="gear" data-gear="hood"><span class="g">🌬️</span><span data-t="gHood"></span></button>
        <button class="gear" data-gear="shield"><span class="g">🛡️</span><span data-t="gShield"></span></button>
      </div>
      <div id="slots">
        <button class="slot" data-slot="0"></button>
        <button class="slot" data-slot="1"></button>
        <button id="mixBtn" disabled></button>
      </div>
      <div id="shelf"></div>
    </div>
  </section>

  <!-- NOTES -->
  <section class="screen" id="s-notes">
    <div class="scroll">
      <h2 class="title" data-t="nTitle"></h2>
      <p class="lede" id="nLede"></p>
      <div id="noteList"></div>
    </div>
  </section>

  <!-- CHALLENGES -->
  <section class="screen" id="s-challenges">
    <div class="scroll">
      <h2 class="title" data-t="cTitle"></h2>
      <p class="lede" data-t="cLede"></p>
      <div id="chList"></div>
    </div>
  </section>

  <!-- SHOP -->
  <section class="screen" id="s-shop">
    <div class="scroll">
      <h2 class="title" data-t="shTitle"></h2>
      <p class="lede" data-t="shLede"></p>
      <div id="shopList"></div>
    </div>
  </section>

  <!-- GUIDE -->
  <section class="screen" id="s-guide">
    <div class="scroll">
      <h2 class="title" data-t="guTitle"></h2>
      <p class="lede" data-t="guLede"></p>
      <div id="guideBody"></div>
    </div>
  </section>

  <!-- PERIODIC -->
  <section class="screen" id="s-pt">
    <div style="padding:12px 14px 0"><h2 class="title" data-t="pTitle"></h2><p class="lede" data-t="pLede"></p></div>
    <div id="ptWrap"><div id="pt"></div><div class="legend" id="ptLegend"></div><p class="ptnote" data-t="pNote"></p></div>
    <div id="elModal"><div id="elCard"></div></div>
  </section>

  <div id="coach"><div id="coachCard">
    <div class="ch-step" id="coachStep"></div>
    <h3 id="coachTitle"></h3>
    <p id="coachText"></p>
    <div class="ch-btns">
      <button class="sbtn" id="coachSkip"></button>
      <button class="sbtn go" id="coachNext"></button>
    </div>
  </div></div>

  <div id="toast"></div>
</div>

var MEM=null;
function save(){
  var d=JSON.stringify(S); MEM=d;
  try{ if(window.storage&&window.storage.set) window.storage.set('labchaos:v1',d).catch(function(){}); }catch(e){}
}
function load(){
  return new Promise(function(res){
    try{
      if(window.storage&&window.storage.get){
        window.storage.get('labchaos:v1').then(function(r){
          if(r&&r.value){ try{ Object.assign(S,JSON.parse(r.value)); }catch(e){} }
          res();
        }).catch(function(){res()});
        return;
      }
    }catch(e){}
    if(MEM){ try{Object.assign(S,JSON.parse(MEM));}catch(e){} }
    res();
  });
}

  $('#hearts').innerHTML=h;
  $('#coins').textContent=S.coins;
  $('#safety').textContent=Math.max(0,Math.round(S.safety));
}

/* ---------- character ---------- */
function drawDoc(state){
  var soot = (state==='soot');
  var skin = soot? '#a08b78' : '#f2d3b3';
  var coat = soot? '#b9ae9c' : '#f2ece0';
  var hair = soot? '#4a3a30' : '#3d2a1f';
  var eyeY = (state==='panic')? 30 : 32;
  var mouth = (state==='panic')
      ? '<ellipse cx="42" cy="41" rx="5" ry="6" fill="#8f3a3a"/>'
      : (state==='ok' ? '<path d="M36 40 Q42 46 48 40" stroke="#8f3a3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
                      : '<path d="M37 41 L47 41" stroke="#8f3a3a" stroke-width="2.4" stroke-linecap="round"/>');
  var goggles = (state==='focus'||state==='panic'||state==='soot')
      ? '<g><rect x="26" y="'+(eyeY-6)+'" width="32" height="13" rx="6" fill="rgba(150,220,235,.5)" stroke="#6d8f99" stroke-width="2"/></g>'
      : '<rect x="26" y="14" width="32" height="8" rx="4" fill="rgba(150,220,235,.45)" stroke="#6d8f99" stroke-width="2"/>';
  var arms = (state==='panic')
      ? '<path d="M20 66 L10 46" stroke="'+coat+'" stroke-width="8" stroke-linecap="round"/><path d="M64 66 L74 46" stroke="'+coat+'" stroke-width="8" stroke-linecap="round"/>'
      : '<path d="M20 66 L14 84" stroke="'+coat+'" stroke-width="8" stroke-linecap="round"/><path d="M64 66 L70 84" stroke="'+coat+'" stroke-width="8" stroke-linecap="round"/>';
  $('#doc').innerHTML =
   '<svg viewBox="0 0 84 108" width="100%">'+
   '<ellipse cx="42" cy="104" rx="24" ry="4" fill="rgba(0,0,0,.35)"/>'+
   '<path d="M22 62 Q22 56 30 56 L54 56 Q62 56 62 62 L66 100 L18 100 Z" fill="'+coat+'"/>'+
   '<path d="M42 56 L42 100" stroke="rgba(0,0,0,.12)" stroke-width="2"/>'+
   arms+
   '<circle cx="42" cy="34" r="21" fill="'+skin+'"/>'+
   '<path d="M21 30 Q24 10 42 10 Q60 10 63 30 Q56 20 42 22 Q28 24 21 30 Z" fill="'+hair+'"/>'+
   (soot?'<path d="M30 12 L28 2 M42 10 L42 0 M54 12 L56 3" stroke="'+hair+'" stroke-width="3" stroke-linecap="round"/>':'')+
   goggles+
   '<circle cx="34" cy="'+eyeY+'" r="'+(state==='panic'?3.6:2.6)+'" fill="#2b2118"/>'+
   '<circle cx="50" cy="'+eyeY+'" r="'+(state==='panic'?3.6:2.6)+'" fill="#2b2118"/>'+
   mouth+
   (soot?'<circle cx="42" cy="34" r="21" fill="rgba(40,30,20,.28)"/>':'')+
   '</svg>';
  $('#doc').className = (state==='panic'?'panic':'');
}
function say(msg){
  var el=$('#say'); el.textContent=msg; el.classList.add('on');
  setTimeout(function(){el.classList.remove('on')},2400);
}

    '</clipPath></defs>'+

    '<g clip-path="url(#cp)">'+
      '<rect x="28" y="'+top+'" width="64" height="120" fill="'+beakerCol+'"/>'+

    '</g>'+
    '<path d="M30 22 L30 112 A12 12 0 0 0 42 124 L78 124 A12 12 0 0 0 90 112 L90 22" fill="none" stroke="rgba(226,242,247,.55)" stroke-width="3" stroke-linejoin="round"/>'+
    '<ellipse cx="60" cy="22" rx="30" ry="6" fill="none" stroke="rgba(226,242,247,.55)" stroke-width="3"/>'+
    '<path d="M36 34 L36 104" stroke="rgba(255,255,255,.4)" stroke-width="3.5" stroke-linecap="round"/>'+
    '<path d="M84 44 L90 44 M84 62 L90 62 M84 80 L90 80" stroke="rgba(226,242,247,.4)" stroke-width="2" stroke-linecap="round"/>'+

}
function setBubbles(rate){
  clearInterval(bubTimer);
  if(rate<=0) return;
  bubTimer=setInterval(function(){
    var b=document.createElement('div'); b.className='bub';
    var sz=3+Math.random()*5;
    b.style.width=sz+'px'; b.style.height=sz+'px';
    b.style.left=(32+Math.random()*44)+'%';
    b.style.bottom=(16+Math.random()*12)+'%';
    b.style.animationDuration=(0.7+Math.random()*0.7)+'s';
    $('#bubbles').appendChild(b);
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); },1500);
  }, Math.max(55, 420 - rate*38));
}
function steam(n){
  for(var i=0;i<n;i++){(function(i){setTimeout(function(){
    var s=document.createElement('div'); s.className='steam';
    s.style.left=(38+Math.random()*24)+'%';
    $('#bubbles').appendChild(s);
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },2100);
  }, i*230)})(i);}
}
function resetStage(){
  clearInterval(bubTimer);
  $('#bubbles').innerHTML='';
  $('#stage').classList.remove('shake');
  $('#gasVeil').style.opacity=0;
  $('#fireLayer').style.opacity=0;
  $('#flash').style.opacity=0;
  beakerFill=0.42; beakerCol='#4aa8d8'; drawBeaker();
  drawDoc('idle');
}

/* ---------- shelf & slots ---------- */
function renderShelf(){
  $('#shelf').innerHTML = REAGENTS.map(function(r){
    var on = (slots[0]===r.id||slots[1]===r.id);
    return '<button class="rg'+(on?' sel':'')+'" data-rg="'+r.id+'">'+
      '<div class="bottle" style="background:'+r.c+'"><i class="sh"></i></div>'+
      '<div class="s">'+r.sym+'</div><div class="n">'+nm(r)+'</div></button>';
  }).join('');
}
function renderSlots(){
  [0,1].forEach(function(i){
    var el=$('.slot[data-slot="'+i+'"]');
    if(slots[i]){
      var r=RG[slots[i]];
      el.className='slot filled';
      el.innerHTML='<span class="swatch" style="background:'+r.c+'"></span><span class="sym">'+r.sym+'</span><span class="nm">'+nm(r)+'</span>';
    } else {
      el.className='slot';
      el.innerHTML='<span class="nm">'+t('slotEmpty').replace('\n','<br>')+'</span>';
    }
  });
  $('#mixBtn').disabled = !(slots[0]&&slots[1]);
}
function pickReagent(id){
  if(slots[0]===id){ slots[0]=null; }
  else if(slots[1]===id){ slots[1]=null; }
  else if(!slots[0]) slots[0]=id;
  else if(!slots[1]) slots[1]=id;
  else { slots[1]=id; }
  renderSlots(); renderShelf();
}

/* ---------- mixing ---------- */
function getRx(a,b){
  var r = RX[K(a,b)];
  if(r) return r;
  return {kind:'meh',int:0,col:'#8fb4c4',fx:'',eq:'—',
    en:{n:t('noReact'),w:t('noReactWhy'),l:t('noReactLesson')},
    ar:{n:t('noReact'),w:t('noReactWhy'),l:t('noReactLesson')}};
}
function mix(){
  if(!slots[0]||!slots[1]) return;
  if(mode==='story' && S.hearts<=0){ toast(t('hpNone')); return; }
  var r = getRx(slots[0],slots[1]);
  var full = gear.goggles&&gear.gloves&&gear.hood&&gear.shield;
  if(full){ S.stats.fullGear++; }

  drawDoc('focus'); say(t('sayMix'));
  $('#mixBtn').disabled=true;

  // pour
  beakerCol=r.col; beakerFill=0.42;
  drawBeaker();
  setTimeout(function(){
    beakerFill = (r.fx==='foam')?0.9:0.6; drawBeaker();
    setBubbles(r.int);
    if(r.fx==='steam') steam(4);
    if(r.fx==='flame'){ $('#fireLayer').style.opacity=.55; }
    if(r.int>=7) $('#stage').classList.add('shake');
    if(r.kind==='gas'){ $('#gasVeil').style.opacity = gear.hood? .18 : .85; }
  },260);

  var key=K(slots[0],slots[1]);
  if(r.eq==='—'){ if(S.inert.indexOf(key)<0) S.inert.push(key); }
  else if(S.discovered.indexOf(key)<0){ S.discovered.push(key); }

  pending = {r:r, key:key, a:slots[0], b:slots[1], full:full};

  var delay = 1150;
  setTimeout(function(){
    if(r.kind==='fire' || (r.kind==='gas' && !gear.hood)) startEmergency(r);
    else resolve(r.kind);
  }, delay);
}

function startEmergency(r){
  var need = (r.kind==='fire')?'ext':'hood';
  pending.need = need;
  $('#emergTitle').textContent = (r.kind==='fire')? t('emergFire') : t('emergGas');
  $('#emerg').classList.add('on');
  drawDoc('panic'); say(r.kind==='gas'? t('sayGas'):'!');
  var total=3000, left=total;
  $('#timerFill').style.width='100%';
  clearInterval(emergTimer);
  emergTimer=setInterval(function(){
    left-=100;
    $('#timerFill').style.width = Math.max(0,(left/total*100))+'%';
    if(left<=0){ clearInterval(emergTimer); $('#emerg').classList.remove('on'); resolve('boom'); }
  },100);
}
function answerEmergency(choice){
  clearInterval(emergTimer);
  $('#emerg').classList.remove('on');
  if(choice===pending.need){
    if(choice==='hood'){ gear.hood=true; renderGear(); $('#gasVeil').style.opacity=.15; $('#hoodVis').classList.add('open'); }
    if(choice==='ext'){ $('#fireLayer').style.opacity=0; }
    S.stats.saves++;
    resolve('saved');
  } else {
    resolve('boom');
  }
}

function resolve(kind){
  var r=pending.r, dc=0, dh=0, ds=0, extra=[];
  clearInterval(bubTimer);
  $('#stage').classList.remove('shake');

  if(kind==='ok'){ dc=25; ds=2; S.stats.successes++; drawDoc('ok'); say(t('sayGood')); }
  else if(kind==='meh'){ dc=8; drawDoc('idle'); }
  else if(kind==='gas'){
    if(gear.hood){ dc=15; ds=-2; S.stats.successes++; drawDoc('focus'); }
    else { dc=-30; dh=-1; ds=-12; drawDoc('panic'); extra.push(t('gearNoHood')); }
  }
  else if(kind==='saved'){ dc=12; ds=-3; drawDoc('focus'); }
  else if(kind==='boom'){
    dc=-45; dh=-1; ds=-15; S.stats.booms++; S.damaged=true;
    $('#flash').style.opacity=1; setTimeout(function(){$('#flash').style.opacity=0},420);
    $('#stage').classList.add('shake');
    setTimeout(function(){$('#stage').classList.remove('shake')},600);
    beakerFill=0.12; beakerCol='#6b5a4a'; drawBeaker();
    drawDoc('soot'); say(t('sayBoom'));
    if(!gear.shield){ dc-=15; extra.push(t('gearNoShield')); }
    if(!gear.goggles){ ds-=8; extra.push(t('gearNoGoggles')); }
    if(S.stats.booms===1) extra.push(t('firstBoom'));
  }

  S.coins=Math.max(0,S.coins+dc);
  S.safety=Math.max(0,Math.min(100,S.safety+ds));
  if(dh<0){
    S.hearts=Math.max(0,S.hearts+dh);
    var hp=$$('#hearts .hp'); if(hp[S.hearts]) hp[S.hearts].classList.add('pulse');
  }

  var won=false;
  if(mode==='story'&&curLevel) won=checkGoal(curLevel,kind);
  if(won && S.levelsDone.indexOf(curLevel.id)<0) S.levelsDone.push(curLevel.id);

  renderHUD(); checkChallenges(); save();
  showSheet(kind,r,dc,dh,ds,extra,won);
  $('#mixBtn').disabled=false;
}

function checkGoal(lv,kind){
  var g=lv.goal, r=pending.r;
  if(g.gear){ for(var i=0;i<g.gear.length;i++) if(!gear[g.gear[i]]) return false; }
  if(g.pair){
    var want=g.pair.slice().sort().join('+');
    if(want!==pending.key) return false;
  }
  if(g.kind && g.kind!==kind && !(g.kind==='gas'&&r.kind==='gas')) return false;
  if(g.fx && g.fx!==r.fx) return false;
  if(g.safe && (kind==='boom')) return false;
  return true;
}

function showSheet(kind,r,dc,dh,ds,extra,won){
  var vmap={ok:'vSuccess',meh:'vPartial',gas:(gear.hood?'vSuccess':'vHazard'),boom:'vBoom',saved:'vSaved',fire:'vFire'};
  var emo={ok:'✅',meh:'🟡',gas:(gear.hood?'✅':'💨'),boom:'💥',saved:'🧯',fire:'🔥'};
  var txt = nm(r);
  $('#vTitle').innerHTML = emo[kind]+' <span>'+t(vmap[kind])+'</span>';
  $('#vEq').textContent = r.eq;
  $('#vWhy').innerHTML = '<b>'+txt.n+'.</b> '+txt.w + (extra.length? ' '+extra.join(' ') : '');
  $('#vLesson').textContent = txt.l;

  var d=[];
  if(dc) d.push('<span class="delta '+(dc>0?'pos':'neg')+'">🪙 '+(dc>0?'+':'')+dc+'</span>');
  if(dh) d.push('<span class="delta neg">❤️ '+t('hpLost')+'</span>');
  if(ds) d.push('<span class="delta '+(ds>0?'pos':'neg')+'">🥽 '+(ds>0?'+':'')+ds+'</span>');
  if(won) d.push('<span class="delta pos">🎯 '+t('goalDone')+'</span>');
  d.push('<span class="delta">📓 '+t('saved')+'</span>');
  $('#vDeltas').innerHTML=d.join('');

  var next=$('#sNext');
  if(mode==='story'){
    if(won){ next.textContent=t('next'); next.dataset.act='next'; }
    else { next.textContent=t('retry'); next.dataset.act='retry'; }
  } else { next.textContent=t('backHome'); next.dataset.act='home'; }
  $('#sheet').classList.add('on');
}
function hideSheet(){ $('#sheet').classList.remove('on'); }

/* ---------- gear ---------- */
function renderGear(){
  $$('.gear').forEach(function(b){ b.classList.toggle('on', !!gear[b.dataset.gear]); });
  $('#hoodVis').classList.toggle('open', gear.hood);
}

/* ---------- screens ---------- */
function go(name){
  $$('.screen').forEach(function(s){s.classList.remove('on')});
  $('#s-'+name).classList.add('on');
  $('#homeBtn').style.display = (name==='home'?'none':'flex');
  if(name==='levels') renderLevels();
  if(name==='notes') renderNotes();
  if(name==='challenges') renderChallenges();
  if(name==='shop') renderShop();
  if(name==='pt') renderPT();
}
function openLab(level){
  mode = level? 'story':'free';
  curLevel = level||null;
  slots=[null,null];
  gear={goggles:false,gloves:false,hood:false,shield:false};
  renderGear(); renderSlots(); renderShelf(); resetStage(); hideSheet();
  var tt=$('#taskText'); if(tt) tt.textContent = level? nm(level).d : t('freeTask');
  $('#task').style.display='block';
  go('lab');
  setTimeout(function(){ say(t('sayIdle')); },500);
}

/* ---------- level list ---------- */
function renderLevels(){
  $('#lvlList').innerHTML = LEVELS.map(function(lv,i){
    var done=S.levelsDone.indexOf(lv.id)>=0;
    var prev=(i===0)||S.levelsDone.indexOf(LEVELS[i-1].id)>=0;
    var o=nm(lv);
    return '<button class="lvl'+(done?' done':'')+(prev?'':' locked')+'" data-lv="'+lv.id+'" '+(prev?'':'disabled')+'>'+
      '<span class="num">'+(done?'✓':lv.id)+'</span>'+
      '<span class="t"><span class="a">'+o.n+'</span><span class="b">'+(prev?o.d:t('lockedTxt'))+'</span></span>'+
      '<span class="st">'+(prev?(done?'🏅':'▶'):'🔒')+'</span></button>';
  }).join('');
}

/* ---------- notes ---------- */
function renderNotes(){
  var total=Object.keys(RX).length;
  $('#nLede').textContent = t('notesCount').replace('@a',S.discovered.length).replace('@b',total);
  if(!S.inert) S.inert=[];
  if(!S.discovered.length && !S.inert.length){ $('#noteList').innerHTML='<div class="empty">'+t('noNotes').replace('\n','<br>')+'</div>'; return; }
  var icon={ok:'✅',meh:'🟡',gas:'💨',boom:'💥',fire:'🔥'};
  var out = S.discovered.map(function(k){
    var r=RX[k]; if(!r) return '';
    var o=nm(r);
    return '<div class="note"><div class="h">'+(icon[r.kind]||'🧪')+' '+o.n+'</div>'+
      '<div class="eqn">'+r.eq+'</div><div class="d">'+o.w+'</div>'+
      '<div class="d" style="margin-top:6px;color:#f2a541">'+o.l+'</div></div>';
  }).join('');
  out += S.inert.map(function(k){
    var names = k.split('+').map(function(id){ return RG[id]? RG[id].sym : id; }).join('  +  ');
    return '<div class="note" style="opacity:.82"><div class="h">⚪ '+t('noReact')+'</div>'+
      '<div class="eqn">'+names+'  →  —</div><div class="d">'+t('noReactWhy')+'</div>'+
      '<div class="d" style="margin-top:6px;color:#f2a541">'+t('noReactLesson')+'</div></div>';
  }).join('');
  $('#noteList').innerHTML = out;
}

/* ---------- challenges ---------- */
function statVal(s){ return (s==='discovered')? S.discovered.length : (s==='levelsDone')? S.levelsDone.length : (S.stats[s]||0); }
function checkChallenges(){
  CHALLENGES.forEach(function(c){
    if(S.claimed.indexOf(c.id)>=0) return;
    if(statVal(c.stat)>=c.need){
      S.claimed.push(c.id); S.coins+=c.reward;
      toast('🏆 '+nm(c).n+'  '+t('chReward').replace('@n',c.reward));
      renderHUD();
    }
  });
}
function renderChallenges(){
  $('#chList').innerHTML = CHALLENGES.map(function(c){
    var v=Math.min(statVal(c.stat),c.need), done=S.claimed.indexOf(c.id)>=0, o=nm(c);
    return '<div class="ch'+(done?' done':'')+'"><span class="ci">'+(done?'🏆':c.ic)+'</span>'+
      '<span class="cb"><span class="cn">'+o.n+'</span><span class="cd">'+o.d+'</span>'+
      '<span class="bar"><i style="width:'+(v/c.need*100)+'%"></i></span></span>'+
      '<span class="cr">'+(done?'✓':v+'/'+c.need)+'</span></div>';
  }).join('');
}

/* ---------- shop ---------- */
function renderShop(){
  var items=[
    {id:'heart', cost:70, ic:'❤️', n:t('buyHeart'), d:t('buyHeartD'), can:S.hearts<S.maxHearts},
    {id:'repair',cost:90, ic:'🛠️', n:t('repair'),   d:t('repairD'),   can:S.safety<100},
    {id:'stock', cost:0,  ic:'🎁', n:t('restock'),  d:t('restockD'),  can:S.coins<40}
  ];
  $('#shopList').innerHTML = items.map(function(it){
    var afford = S.coins>=it.cost;
    var lbl = !it.can? t('owned') : (afford? t('buy')+' · '+(it.cost||'free') : t('cant'));
    return '<div class="ch"><span class="ci">'+it.ic+'</span><span class="cb"><span class="cn">'+it.n+'</span>'+
      '<span class="cd">'+it.d+'</span></span>'+
      '<button class="sbtn'+((it.can&&afford)?' go':'')+'" style="flex:0 0 auto;padding:8px 12px;font-size:12px" '+
      ((it.can&&afford)?'data-buy="'+it.id+'"':'disabled')+'>'+lbl+'</button></div>';
  }).join('');
}
function buy(id){
  if(id==='heart'&&S.coins>=70&&S.hearts<S.maxHearts){ S.coins-=70; S.hearts++; toast('❤️ '+t('bought')); }
  if(id==='repair'&&S.coins>=90&&S.safety<100){ S.coins-=90; S.safety=100; S.damaged=false; toast('🥽 '+t('safetyUp')); }
  if(id==='stock'&&S.coins<40){ S.coins+=40; toast('🪙 +40'); }
  renderHUD(); renderShop(); save();
}

/* ---------- periodic table ---------- */
var shelfZ={};
REAGENTS.forEach(function(r){ (r.z||[]).forEach(function(z){ shelfZ[z]=1; }); });
function renderPT(){
  $('#pt').innerHTML = ELEMENTS.map(function(e){
    var c=CATS[e.cat];
    return '<div class="el'+(shelfZ[e.z]?' have':'')+'" style="background:'+c.c+';grid-row:'+e.row+';grid-column:'+e.col+'" data-z="'+e.z+'">'+
      '<span class="z">'+e.z+'</span>'+e.sym+'</div>';
  }).join('');
  $('#ptLegend').innerHTML = Object.keys(CATS).map(function(k){
    return '<span class="lg" style="background:'+CATS[k].c+'">'+nm(CATS[k])+'</span>';
  }).join('');
}
function showEl(z){
  var e=ELEMENTS.filter(function(x){return x.z===z})[0]; if(!e) return;
  var c=CATS[e.cat];
  $('#elCard').innerHTML =
    '<div class="big" style="color:'+c.c+'">'+e.sym+'</div>'+
    '<div class="nm">'+(L==='ar'?e.ar:e.en)+'</div>'+
    '<div class="meta">'+(L==='ar'?'العدد الذري':'Atomic number')+': '+e.z+'<br>'+
      (L==='ar'?'الكتلة الذرية':'Atomic mass')+': '+e.m+'</div>'+
    '<div class="cat" style="background:'+c.c+'">'+nm(c)+'</div>'+
    (shelfZ[e.z]?'<div class="meta" style="color:#f2a541">'+(L==='ar'?'موجود على رفّك':'On your shelf')+'</div>':'');
  $('#elModal').classList.add('on');
}

/* ---------- render all ---------- */
function renderAll(){
  renderHUD(); renderShelf(); renderSlots(); renderGear(); drawBeaker();
  var on=$('.screen.on');
  if(on){
    var id=on.id.replace('s-','');
    if(id==='levels')renderLevels(); if(id==='notes')renderNotes();
    if(id==='challenges')renderChallenges(); if(id==='shop')renderShop(); if(id==='pt')renderPT();
    if(id==='lab'){ var tt=$('#taskText'); if(tt) tt.textContent = curLevel? nm(curLevel).d : t('freeTask'); }
  }
}

/* ---------- events ---------- */
document.addEventListener('click', function(ev){
  var el;
  if(!ev.target||!ev.target.closest) return;
  if(el=ev.target.closest('[data-go]')){
    if(el.dataset.go==='free') openLab(null); else go(el.dataset.go);
    return;
  }
  if(el=ev.target.closest('[data-rg]')){ pickReagent(el.dataset.rg); return; }
  if(el=ev.target.closest('[data-slot]')){ var i=+el.dataset.slot; slots[i]=null; renderSlots(); renderShelf(); return; }
  if(el=ev.target.closest('[data-gear]')){ gear[el.dataset.gear]=!gear[el.dataset.gear]; renderGear(); return; }
  if(el=ev.target.closest('[data-e]')){ answerEmergency(el.dataset.e); return; }
  if(el=ev.target.closest('[data-lv]')){
    var lv=LEVELS.filter(function(x){return x.id===+el.dataset.lv})[0];
    if(lv) openLab(lv); return;
  }
  if(el=ev.target.closest('[data-buy]')){ buy(el.dataset.buy); return; }
  if(el=ev.target.closest('.el')){ showEl(+el.dataset.z); return; }
  if(ev.target.closest('#elModal')){ $('#elModal').classList.remove('on'); return; }
  if(ev.target.id==='mixBtn'){ mix(); return; }
  if(ev.target.id==='sAgain'){ hideSheet(); resetStage(); slots=[null,null]; renderSlots(); renderShelf(); return; }
  if(ev.target.id==='sNext'){
    var act=ev.target.dataset.act;
    hideSheet(); resetStage(); slots=[null,null]; renderSlots(); renderShelf();
    if(act==='next'){
      var i=LEVELS.findIndex(function(x){return curLevel&&x.id===curLevel.id});
      if(i>=0 && i+1<LEVELS.length) openLab(LEVELS[i+1]);
      else { toast(t('allDone')); go('levels'); }
    } else if(act==='home'){ go('home'); }
    return;
  }
  if(ev.target.id==='langBtn'){ L=(L==='ar'?'en':'ar'); applyLang(); return; }
  if(ev.target.id==='homeBtn'){ hideSheet(); clearInterval(emergTimer); $('#emerg').classList.remove('on'); go('home'); return; }
});

/* ---------- boot ---------- */
load().then(function(){
  if(navigator.language && navigator.language.indexOf('ar')===0) L='ar';
  applyLang();
  drawBeaker(); drawDoc('idle');
  $('#homeBtn').style.display='none';
});

/* ================= GUIDE, HINTS, FIRST-RUN COACHING ================= */

var hintOpen=false;

function renderTask(){
  var tk=$('#task .tk'), btn=$('#hintBtn');
  if(!curLevel){
    btn.style.display='none'; hintOpen=false;
    tk.innerHTML='<span class="tl">'+t('taskLabel')+'</span><span>'+t('freeTask')+'</span>';
    return;
  }
  btn.style.display='block';
  btn.classList.toggle('on',hintOpen);
  var o=nm(curLevel);
  var html='<span class="tl">'+t('taskLabel')+'</span><span>'+o.d+'</span>';
  if(hintOpen){
    var h=curLevel.hint? (L==='ar'?curLevel.hint.ar:curLevel.hint.en) : '';
    html+='<div style="margin-top:6px;font-size:12px;color:#f2a541">'+t('hintTitle')+': '+h+'</div>';
    var g=curLevel.goal;
    if(g.pair){
      html+='<div class="hintchips">'+g.pair.map(function(id){
        var r=RG[id]; if(!r) return '';
        return '<span class="hintchip"><i style="background:'+r.c+'"></i>'+r.sym+' · '+nm(r)+'</span>';
      }).join('')+'</div>';
    }
    if(g.gear){
      var labels={goggles:t('gGoggles'),gloves:t('gGloves'),hood:t('gHood'),shield:t('gShield')};
      html+='<div class="hintgear">'+t('hintGear')+' '+g.gear.map(function(k){return labels[k]}).join(' + ')+'</div>';
    }
  }
  tk.innerHTML=html;
}

function renderGuide(){
  var out = guideData().map(function(s){
    var h='<div class="gsec"><h3>'+s.h+'</h3>';
    if(s.p) h+='<p>'+s.p+'</p>';
    if(s.steps) h+=s.steps.map(function(x,i){
      return '<div class="gstep"><span class="n">'+(i+1)+'</span><span class="x">'+x+'</span></div>';
    }).join('');
    if(s.rows) h+=s.rows.map(function(r){
      return '<div class="grow"><span class="k">'+r[0]+'</span><span>'+r[1]+'</span></div>';
    }).join('');
    return h+'</div>';
  }).join('');

  out += '<div class="gsec"><h3>'+t('gWalk')+'</h3><p>'+t('gWalkNote')+'</p>'+
    LEVELS.map(function(lv){
      var o=nm(lv), hint=lv.hint? (L==='ar'?lv.hint.ar:lv.hint.en):'';
      return '<button class="gwalk" data-walk="'+lv.id+'">'+
        '<span class="q"><span><b>'+lv.id+'.</b> '+o.n+'</span><span style="color:#8ba0a8">▾</span></span>'+
        '<span class="a">'+hint+'</span></button>';
    }).join('') + '</div>';

  $('#guideBody').innerHTML=out;
}

/* ---------- first-run coaching ---------- */
var COACH=[['c1t','c1x'],['c2t','c2x'],['c3t','c3x'],['c4t','c4x']];
var coachI=0;
function showCoach(i){
  coachI=i;
  $('#coachStep').textContent=(i+1)+' / '+COACH.length;
  $('#coachTitle').textContent=t(COACH[i][0]);
  $('#coachText').textContent=t(COACH[i][1]);
  $('#coachSkip').textContent=t('coachSkip');
  $('#coachNext').textContent=(i===COACH.length-1)? t('coachDone') : t('coachNext');
  $('#coach').classList.add('on');
}
function endCoach(){
  $('#coach').classList.remove('on');
  S.seenCoach=true; save();
}

/* ---------- wire it up ---------- */
document.addEventListener('click', function(ev){
  if(!ev.target||!ev.target.closest) return;
  var el;
  if(ev.target.id==='hintBtn'){ hintOpen=!hintOpen; renderTask(); return; }
  if(el=ev.target.closest('[data-walk]')){ el.classList.toggle('open'); return; }
  if(ev.target.id==='coachSkip'){ endCoach(); return; }
  if(ev.target.id==='coachNext'){
    if(coachI<COACH.length-1) showCoach(coachI+1); else endCoach();
    return;
  }
});

/* hook the guide screen and the coach into the existing flow */
var _go=go;
go=function(name){ _go(name); if(name==='guide') renderGuide(); };

var _openLab=openLab;
openLab=function(level){
  hintOpen=false;
  _openLab(level);
  renderTask();
  if(!S.seenCoach) setTimeout(function(){ showCoach(0); },380);
};

var _renderAll=renderAll;
renderAll=function(){
  _renderAll();
  var on=$('.screen.on');
  if(on&&on.id==='s-guide') renderGuide();
  if(on&&on.id==='s-lab') renderTask();
};
